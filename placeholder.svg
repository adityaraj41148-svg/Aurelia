<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Soft inner border -->
  <rect x="12" y="12" width="376" height="376" rx="12" fill="none" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />

  <!-- Center Icon Group -->
  <g transform="translate(140, 110)">
    <!-- Image Frame Icon -->
    <rect x="0" y="0" width="120" height="90" rx="12" fill="none" stroke="url(#iconGrad)" stroke-width="6" />
    <!-- Sun/Circle -->
    <circle cx="35" cy="30" r="12" fill="url(#iconGrad)" opacity="0.8" />
    <!-- Mountain Peaks -->
    <path d="M 12 78 L 45 40 L 70 65 L 85 50 L 108 78 Z" fill="url(#iconGrad)" opacity="0.7" />
  </g>

  <!-- Text Label -->
  <text x="200" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#4B5563" text-anchor="middle" letter-spacing="0.5">
    Image Not Available
  </text>

  <!-- Subtitle / Brand badge -->
  <text x="200" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#9CA3AF" text-anchor="middle">
    AA Mart Product Catalog
  </text>
</svg>
