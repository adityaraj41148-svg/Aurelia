<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bag | AURELIA — WEAR THE MOMENT.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#faf8f5] text-[#0f0e0d] font-sans-body min-h-screen flex flex-col antialiased selection:bg-[#c5a059] selection:text-white overflow-x-hidden">

    <header id="main-header" class="sticky top-0 nav-header z-40 px-4 sm:px-8 py-4">
        <div class="container mx-auto max-w-7xl flex items-center justify-between gap-4">
            <a href="index.html" class="flex flex-col group">
                <span class="font-serif-title font-bold text-2xl sm:text-3xl tracking-widest text-[#0f0e0d]">A U R E L I A</span>
                <span class="text-[8px] font-bold text-[#8c857b] tracking-editorial uppercase leading-none">WEAR THE MOMENT.</span>
            </a>

            <nav class="hidden lg:flex items-center gap-8 text-xs font-semibold uppercase tracking-editorial text-[#0f0e0d]">
                <a href="index.html" class="hover:text-[#c5a059]">Home</a>
                <a href="shop.html" class="hover:text-[#c5a059]">Shop All</a>
                <a href="cart.html" class="text-[#c5a059] font-bold">Shopping Bag (<span id="page-cart-count">0</span>)</a>
            </nav>

            <div class="flex items-center gap-5 text-[#0f0e0d]">
                <a href="checkout.html" class="text-xs font-semibold uppercase tracking-editorial hover:text-[#c5a059]">Checkout →</a>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 max-w-6xl py-12 space-y-8 flex-grow">
        <div class="text-center space-y-2 border-b border-[#e6e1d6] pb-8">
            <span class="text-[10px] font-bold text-[#c5a059] uppercase tracking-editorial block">MY BAG</span>
            <h1 class="font-serif-title text-4xl font-normal text-[#0f0e0d]">SHOPPING BAG</h1>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div id="cart-page-items" class="lg:col-span-8 space-y-4">
                <!-- Injected via script.js -->
            </div>

            <div class="lg:col-span-4 bg-[#f5f2eb] p-6 border border-[#e6e1d6] space-y-6 h-fit">
                <h3 class="text-sm font-semibold tracking-editorial uppercase text-[#0f0e0d] border-b border-[#e6e1d6] pb-3">ORDER SUMMARY</h3>

                <div class="flex gap-2">
                    <input type="text" id="coupon-input" placeholder="COUPON (e.g. AURELIA10)" class="flex-grow bg-[#faf8f5] border border-[#e6e1d6] px-3 py-2 text-xs font-mono uppercase focus:outline-none">
                    <button onclick="applyCouponCode()" class="bg-[#0f0e0d] text-white font-semibold text-xs px-4 py-2 hover:bg-[#c5a059]">APPLY</button>
                </div>
                <div id="applied-coupon-msg" class="hidden text-[11px] font-semibold"></div>

                <div class="space-y-3 text-xs text-[#57534e] pt-2 border-t border-[#e6e1d6]">
                    <div class="flex justify-between"><span>Subtotal:</span><span id="cart-subtotal-val" class="font-mono font-bold text-[#0f0e0d]">₹0</span></div>
                    <div class="flex justify-between text-[#c5a059]"><span>Coupon Discount:</span><span id="cart-discount-val" class="font-mono">-₹0</span></div>
                    <div class="flex justify-between"><span>Shipping:</span><span id="cart-delivery-val" class="font-mono text-[#0f0e0d]">COMPLIMENTARY</span></div>
                    <div class="flex justify-between font-bold text-base text-[#0f0e0d] pt-3 border-t border-[#e6e1d6]">
                        <span>TOTAL:</span>
                        <span id="cart-total-val" class="font-mono">₹0</span>
                    </div>
                </div>

                <a href="checkout.html" class="block w-full bg-[#0f0e0d] hover:bg-[#c5a059] text-white text-center font-medium text-xs py-4 tracking-editorial uppercase transition">
                    PROCEED TO CHECKOUT →
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-[#0f0e0d] text-[#e6e0d4] py-12 text-xs text-center">
        <p>&copy; 2026 AURELIA. WEAR THE MOMENT.</p>
    </footer>

    <script src="products.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCartPage();
            calculateCartTotals();
        });
    </script>
</body>
</html>
